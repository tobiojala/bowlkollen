name: CI

on:
  push:
    branches: [main, "claude/**", "wip/**"]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Hard gates — these are green today and must stay green.
      - name: Typecheck
        run: pnpm --filter @bowlkollen/web exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter @bowlkollen/web test

      # Soft gate — surfaces lint findings without blocking while the
      # pre-existing set-state-in-effect warnings are cleaned up. Flip to a
      # hard gate (drop continue-on-error) once lint is clean.
      - name: Lint
        run: pnpm --filter @bowlkollen/web lint
        continue-on-error: true

  # Build needs Supabase env. Add NEXT_PUBLIC_SUPABASE_URL + _ANON_KEY as repo
  # secrets, then remove the `if: false` to enable it.
  build:
    name: build (needs Supabase secrets)
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowlkollen/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
